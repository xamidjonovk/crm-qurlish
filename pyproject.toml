[project]
name = "construction-crm"
version = "3.0.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlmodel>=0.0.24,<1", "psycopg[binary]>=3.2,<4", "pydantic-settings>=2,<3", "alembic>=1.15,<2", "pwdlib[argon2]>=0.2,<1", "PyJWT>=2.10,<3", "python-multipart>=0.0.20"]
[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.11,<1"]
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
